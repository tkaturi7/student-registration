<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .container {
      width: min(520px, 100%);
      background: #ffffff;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      color: #1e3c72;
      font-size: 30px;
    }

    .header p {
      margin-top: 8px;
      color: #666666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #333333;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2a5298;
      box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.15);
    }

    input[type="file"] {
      padding: 10px;
      background: #f7f9fc;
    }

    .file-help {
      display: block;
      margin-top: 7px;
      color: #666666;
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00b09b, #96c93d);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    button:hover {
      background: linear-gradient(135deg, #009688, #7cb342);
    }

    button:disabled {
      background: #9ca3af;
      cursor: wait;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #e8f0fe;
      color: #174ea6;
      text-align: center;
      font-size: 14px;
    }

    .links {
      text-align: center;
      margin-top: 18px;
    }

    .links a {
      color: #1e3c72;
      font-weight: bold;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #777777;
    }

    @media (max-width: 560px) {
      body {
        align-items: flex-start;
        padding: 16px;
      }

      .container {
        padding: 24px;
      }

      .header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>Student Registration</h1>
      <p>Submit student details and upload a resume.</p>
    </header>

    <form
      id="registration-form"
      action="/register"
      method="POST"
      enctype="multipart/form-data"
    >
      <div class="form-group">
        <label for="student_name">Student Name</label>
        <input
          type="text"
          id="student_name"
          name="student_name"
          placeholder="Enter student name"
          maxlength="100"
          required
        >
      </div>

      <div class="form-group">
        <label for="student_id">Student ID</label>
        <input
          type="text"
          id="student_id"
          name="student_id"
          placeholder="Enter student ID"
          maxlength="50"
          required
        >
      </div>

      <div class="form-group">
        <label for="contact_no">Contact Number</label>
        <input
          type="tel"
          id="contact_no"
          name="contact_no"
          placeholder="Enter contact number"
          maxlength="20"
          required
        >
      </div>

      <div class="form-group">
        <label for="location">Location</label>
        <input
          type="text"
          id="location"
          name="location"
          placeholder="Enter location"
          maxlength="100"
          required
        >
      </div>

      <div class="form-group">
        <label for="resume">Resume</label>
        <input
          type="file"
          id="resume"
          name="resume"
          accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          required
        >

        <span class="file-help">
          Allowed formats: PDF, DOC and DOCX. Maximum size: 5 MB.
        </span>
      </div>

      <button id="submit-button" type="submit">
        Submit Registration
      </button>

      <div
        id="form-status"
        class="status"
        role="status"
        aria-live="polite"
      ></div>
    </form>

    <div class="links">
      <a href="/students">View registered students</a>
    </div>

    <footer class="footer">
      Student Registration on GKE | Version 3
    </footer>
  </main>

  <script>
    const registrationForm =
      document.getElementById("registration-form");

    const submitButton =
      document.getElementById("submit-button");

    const formStatus =
      document.getElementById("form-status");

    registrationForm.addEventListener("submit", (event) => {
      const selectedFile =
        document.getElementById("resume").files[0];

      const maximumSize = 5 * 1024 * 1024;

      if (selectedFile && selectedFile.size > maximumSize) {
        event.preventDefault();

        formStatus.style.display = "block";
        formStatus.textContent =
          "The selected resume exceeds the 5 MB limit.";

        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      formStatus.style.display = "block";
      formStatus.textContent =
        "Uploading the resume and saving the registration...";
    });
  </script>
</body>
</html>
