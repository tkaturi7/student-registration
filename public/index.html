<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Registration</title><style>body{margin:0;padding:30px;min-height:100vh;font-family:Arial,sans-serif;background:#eef2ff}.card{max-width:520px;margin:auto;padding:30px;background:#fff;border-radius:16px;box-shadow:0 10px 30px #0002}label{display:block;margin-top:16px;font-weight:bold}input{width:100%;padding:12px;margin-top:6px;box-sizing:border-box}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:8px;color:#fff;background:#2563eb;font-weight:bold}</style></head><body><main class="card"><h1>Student Registration</h1><form action="/register" method="POST" enctype="multipart/form-data"><label>Student Name<input name="student_name" maxlength="100" required></label><label>Student ID<input name="student_id" maxlength="50" required></label><label>Contact Number<input name="contact_no" maxlength="20" required></label><label>Location<input name="location" maxlength="100" required></label><label>Resume<input type="file" name="resume" accept=".pdf,.doc,.docx" required></label><button type="submit">Submit Registration</button></form></main></body></html>
