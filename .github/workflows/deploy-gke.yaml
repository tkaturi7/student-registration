name: Build and deploy tagged release to GKE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      controlled_failure_test:
        description: "Deploy a nonexistent image and validate automatic rollback"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: student-registration-production
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/student-registration

jobs:
  deploy:
    name: Build, push, deploy and validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment script
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x scripts/deploy-with-rollback.sh
          bash -n scripts/deploy-with-rollback.sh

      - name: Validate application source
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check server.js
          test -s public/index.html
          grep -q '<!DOCTYPE html>' public/index.html
          grep -q 'action="/register"' public/index.html
          grep -q 'method="POST"' public/index.html
          grep -q 'enctype="multipart/form-data"' public/index.html
          grep -q 'Student Registration' public/index.html

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: |
          set -Eeuo pipefail
          gcloud auth configure-docker "${{ vars.GAR_LOCATION }}-docker.pkg.dev" --quiet

      - name: Build application image
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --pull             --tag "${IMAGE}:${GITHUB_SHA}"             --tag "${IMAGE}:${GITHUB_REF_NAME}" .

      - name: Push immutable commit image
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Push release tag image
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: docker push "${IMAGE}:${GITHUB_REF_NAME}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Confirm target resources
        shell: bash
        run: |
          set -Eeuo pipefail
          kubectl get deployment student-registration -n "${{ vars.K8S_NAMESPACE }}"
          kubectl get service student-registration-service -n "${{ vars.K8S_NAMESPACE }}"

      - name: Deploy, validate and automatically roll back
        shell: bash
        env:
          NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          DEPLOYMENT: student-registration
          CONTAINER: application
          SERVICE: student-registration-service
          IMAGE: ${{ env.IMAGE }}
          NORMAL_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          FAILURE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.controlled_failure_test || false }}
        run: scripts/deploy-with-rollback.sh

      - name: Display final deployment
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          kubectl get deployment,replicaset,pods,service,endpointslice             -n "${{ vars.K8S_NAMESPACE }}" -o wide
